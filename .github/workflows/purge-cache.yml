name: Purgar caché de Cloudflare tras el deploy

# Cloudflare Pages despliega automáticamente en cada push a main (integración
# nativa con GitHub, no un paso de este workflow). Este workflow corre en
# paralelo y espera un margen prudente antes de purgar, para no purgar antes
# de que el build/deploy de Pages haya terminado.
on:
  push:
    branches: [main]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que termine el deploy de Cloudflare Pages
        run: sleep 90

      - name: Purgar caché de las URLs afectadas
        env:
          CF_API_TOKEN: ${{ secrets.CF_URGENCIAS_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "files": [
                "https://urgencias.doctorhiguera.com/",
                "https://urgencias.doctorhiguera.com/index.html",
                "https://urgencias.doctorhiguera.com/sw.js",
                "https://urgencias.doctorhiguera.com/manifest.json",
                "https://urgencias.doctorhiguera.com/icon.svg",
                "https://urgencias.doctorhiguera.com/data/cheatsheets.js",
                "https://urgencias.doctorhiguera.com/data/scales.js",
                "https://urgencias.doctorhiguera.com/data/formulas.js",
                "https://urgencias.doctorhiguera.com/data/protocols.js",
                "https://urgencias.doctorhiguera.com/data/drugs.js",
                "https://urgencias.doctorhiguera.com/data/infusions.js",
                "https://urgencias.doctorhiguera.com/data/intubacion.js",
                "https://urgencias.doctorhiguera.com/data/fichas.js",
                "https://urgencias.doctorhiguera.com/data/bibliografia.js"
              ]
            }'
